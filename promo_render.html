<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Froggy Jump Promo Renderer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0b1410; color: #fff; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; gap: 30px; }
    canvas { display: block; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
  </style>
</head>
<body>
  <canvas id="canvasSquare" width="800" height="800"></canvas>
  <canvas id="canvasPortrait" width="1080" height="1920"></canvas>
  <canvas id="canvasLandscape" width="1920" height="1080"></canvas>

  <script>
    // --- Вспомогательные функции отрисовки арт-элементов Froggy Jump ---

    function drawWaterBackground(ctx, w, h, topColor = '#102820', bottomColor = '#1e4838') {
      const grad = ctx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, topColor);
      grad.addColorStop(0.5, '#16382c');
      grad.addColorStop(1, bottomColor);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      // Круговые блики воды (water caustics)
      ctx.save();
      for (let i = 0; i < 24; i++) {
        const cx = (Math.sin(i * 1.7) * 0.5 + 0.5) * w;
        const cy = (Math.cos(i * 2.3) * 0.5 + 0.5) * h;
        const rad = 60 + (i % 5) * 35;
        const cGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
        cGrad.addColorStop(0, 'rgba(100, 255, 218, 0.08)');
        cGrad.addColorStop(1, 'rgba(100, 255, 218, 0)');
        ctx.fillStyle = cGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, rad, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawLilyPad(ctx, x, y, width, height, hasFlower = false) {
      ctx.save();
      ctx.translate(x, y);

      // Тень под кувшинкой
      ctx.fillStyle = 'rgba(0, 20, 10, 0.45)';
      ctx.beginPath();
      ctx.ellipse(0, 8, width / 2 + 4, height / 2 + 2, 0, 0, Math.PI * 2);
      ctx.closePath();
      ctx.fill();

      // Сама кувшинка
      const padGrad = ctx.createRadialGradient(0, -height * 0.2, 5, 0, 0, width / 2);
      padGrad.addColorStop(0, '#43a047');
      padGrad.addColorStop(0.7, '#2e7d32');
      padGrad.addColorStop(1, '#1b5e20');
      ctx.fillStyle = padGrad;

      ctx.beginPath();
      // Вырез кувшинки (узкий естественный надрез)
      ctx.arc(0, 0, width / 2, 0.12, Math.PI * 2 - 0.12);
      ctx.lineTo(0, 0);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = '#81c784';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Прожилки
      ctx.strokeStyle = 'rgba(129, 199, 132, 0.45)';
      ctx.lineWidth = 2;
      for (let angle = 0.35; angle < Math.PI * 2 - 0.35; angle += 0.75) {
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(angle) * width * 0.46, Math.sin(angle) * height * 0.46);
        ctx.stroke();
      }

      // Цветок лотоса
      if (hasFlower) {
        ctx.save();
        ctx.translate(width * 0.28, -height * 0.15);
        const petalColors = ['#f48fb1', '#f06292', '#e91e63'];
        for (let p = 0; p < 8; p++) {
          ctx.save();
          ctx.rotate((p * Math.PI) / 4);
          ctx.fillStyle = petalColors[p % 3];
          ctx.beginPath();
          ctx.ellipse(0, -12, 6, 14, 0, 0, Math.PI * 2);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
        ctx.fillStyle = '#ffd54f';
        ctx.beginPath();
        ctx.arc(0, 0, 7, 0, Math.PI * 2);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      ctx.restore();
    }

    function drawCuteFrog(ctx, x, y, scale = 1, withWings = false, withShield = false) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);

      // Пузырь-щит
      if (withShield) {
        ctx.save();
        const sGrad = ctx.createRadialGradient(-15, -20, 10, 0, 0, 60);
        sGrad.addColorStop(0, 'rgba(255, 255, 255, 0.7)');
        sGrad.addColorStop(0.5, 'rgba(128, 222, 234, 0.35)');
        sGrad.addColorStop(0.9, 'rgba(0, 188, 212, 0.5)');
        sGrad.addColorStop(1, 'rgba(0, 151, 167, 0.75)');
        ctx.fillStyle = sGrad;
        ctx.strokeStyle = '#e0f7fa';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, 60, 0, Math.PI * 2);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      // Крылья стрекозы
      if (withWings) {
        ctx.save();
        ctx.fillStyle = 'rgba(255, 241, 118, 0.85)';
        ctx.strokeStyle = '#fbc02d';
        ctx.lineWidth = 2.5;

        // Левое крыло
        ctx.beginPath();
        ctx.ellipse(-38, -16, 42, 16, -0.35, 0, Math.PI * 2);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Правое крыло
        ctx.beginPath();
        ctx.ellipse(38, -16, 42, 16, 0.35, 0, Math.PI * 2);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      // Тень под лягушкой
      ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
      ctx.beginPath();
      ctx.ellipse(0, 36, 32, 10, 0, 0, Math.PI * 2);
      ctx.closePath();
      ctx.fill();

      // Задние лапки
      ctx.fillStyle = '#2e7d32';
      ctx.beginPath();
      ctx.ellipse(-32, 22, 18, 12, -0.3, 0, Math.PI * 2);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.ellipse(32, 22, 18, 12, 0.3, 0, Math.PI * 2);
      ctx.closePath();
      ctx.fill();

      // Пальчики задних лапок
      ctx.fillStyle = '#1b5e20';
      [-38, -32, -26, 26, 32, 38].forEach(lx => {
        ctx.beginPath();
        ctx.arc(lx, 32, 4.5, 0, Math.PI * 2);
        ctx.closePath();
        ctx.fill();
      });

      // Круглое зеленое тело с градиентом
      const bodyGrad = ctx.createRadialGradient(-8, -12, 6, 0, 4, 45);
      bodyGrad.addColorStop(0, '#a5d6a7');
      bodyGrad.addColorStop(0.3, '#66bb6a');
      bodyGrad.addColorStop(0.8, '#43a047');
      bodyGrad.addColorStop(1, '#2e7d32');
      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.ellipse(0, 6, 38, 34, 0, 0, Math.PI * 2);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#1b5e20';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Светлый пузик
      const bellyGrad = ctx.createLinearGradient(0, 0, 0, 34);
      bellyGrad.addColorStop(0, '#e8f5e9');
      bellyGrad.addColorStop(1, '#c8e6c9');
      ctx.fillStyle = bellyGrad;
      ctx.beginPath();
      ctx.ellipse(0, 16, 22, 18, 0, 0, Math.PI * 2);
      ctx.closePath();
      ctx.fill();

      // Большие круглые глазницы (возвышаются над головой)
      // Левая глазница
      ctx.fillStyle = '#43a047';
      ctx.strokeStyle = '#1b5e20';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(-20, -22, 16, 0, Math.PI * 2);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Правая глазница
      ctx.beginPath();
      ctx.arc(20, -22, 16, 0, Math.PI * 2);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Белки глаз
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(-20, -22, 12, 0, Math.PI * 2);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.arc(20, -22, 12, 0, Math.PI * 2);
      ctx.closePath();
      ctx.fill();

      // Радужка (золотистая)
      ctx.fillStyle = '#fbc02d';
      ctx.beginPath();
      ctx.arc(-19, -21, 8.5, 0, Math.PI * 2);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.arc(19, -21, 8.5, 0, Math.PI * 2);
      ctx.closePath();
      ctx.fill();

      // Зрачки
      ctx.fillStyle = '#111111';
      ctx.beginPath();
      ctx.arc(-18, -21, 5.5, 0, Math.PI * 2);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.arc(18, -21, 5.5, 0, Math.PI * 2);
      ctx.closePath();
      ctx.fill();

      // Блики в глазах (милый аниме-блеск)
      ctx.fillStyle = '#ffffff';
      [[-21, -24, 3.5], [17, -24, 3.5], [-16, -18, 1.8], [22, -18, 1.8]].forEach(([bx, by, br]) => {
        ctx.beginPath();
        ctx.arc(bx, by, br, 0, Math.PI * 2);
        ctx.closePath();
        ctx.fill();
      });

      // Ноздри
      ctx.fillStyle = '#1b5e20';
      ctx.beginPath();
      ctx.arc(-4, -6, 1.8, 0, Math.PI * 2);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.arc(4, -6, 1.8, 0, Math.PI * 2);
      ctx.closePath();
      ctx.fill();

      // Добрая улыбка
      ctx.strokeStyle = '#1b5e20';
      ctx.lineWidth = 3.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(0, -2, 14, 0.25 * Math.PI, 0.75 * Math.PI);
      ctx.stroke();

      // Розовые щечки (румянец)
      ctx.fillStyle = 'rgba(240, 98, 146, 0.55)';
      ctx.beginPath();
      ctx.ellipse(-24, 4, 7, 4.5, 0, 0, Math.PI * 2);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.ellipse(24, 4, 7, 4.5, 0, 0, Math.PI * 2);
      ctx.closePath();
      ctx.fill();

      // Передние лапки
      ctx.fillStyle = '#43a047';
      ctx.strokeStyle = '#1b5e20';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(-14, 18, 7, 10, -0.4, 0, Math.PI * 2);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.ellipse(14, 18, 7, 10, 0.4, 0, Math.PI * 2);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.restore();
    }

    function drawFly(ctx, x, y, scale = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);

      // Крылышки
      ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.strokeStyle = 'rgba(100, 200, 255, 0.8)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(-6, -6, 7, 4, -0.6, 0, Math.PI * 2);
      ctx.ellipse(6, -6, 7, 4, 0.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Тельце
      ctx.fillStyle = '#212121';
      ctx.beginPath();
      ctx.ellipse(0, 0, 5, 7, 0, 0, Math.PI * 2);
      ctx.fill();

      // Красные глазки
      ctx.fillStyle = '#f44336';
      ctx.beginPath();
      ctx.arc(-2.5, -4.5, 2.2, 0, Math.PI * 2);
      ctx.arc(2.5, -4.5, 2.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawGoldBadgeText(ctx, text, x, y, fontSize, subtext = '') {
      ctx.save();
      ctx.textAlign = 'center';

      // 3D Тень
      ctx.font = `900 ${fontSize}px 'Segoe UI', system-ui, sans-serif`;
      ctx.fillStyle = '#0a1a12';
      ctx.fillText(text, x, y + 8);
      ctx.fillStyle = '#1b5e20';
      ctx.fillText(text, x, y + 4);

      // Золотисто-неоновый градиент букв
      const textGrad = ctx.createLinearGradient(0, y - fontSize, 0, y);
      textGrad.addColorStop(0, '#ffffff');
      textGrad.addColorStop(0.2, '#c8e6c9');
      textGrad.addColorStop(0.7, '#66bb6a');
      textGrad.addColorStop(1, '#43a047');
      ctx.fillStyle = textGrad;
      ctx.fillText(text, x, y);

      ctx.strokeStyle = '#0d2818';
      ctx.lineWidth = Math.max(3, fontSize * 0.05);
      ctx.strokeText(text, x, y);

      if (subtext) {
        ctx.font = `bold ${Math.round(fontSize * 0.38)}px 'Segoe UI', system-ui, sans-serif`;
        ctx.fillStyle = '#ffd54f';
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 8;
        ctx.fillText(subtext, x, y + fontSize * 0.45);
      }

      ctx.restore();
    }

    // =========================================================================
    // 1. Отрисовка Квадратного Промо (800x800)
    // =========================================================================
    function renderSquare() {
      const c = document.getElementById('canvasSquare');
      const ctx = c.getContext('2d');
      const w = 800, h = 800;

      drawWaterBackground(ctx, w, h, '#0f291e', '#1c4c38');

      // Плавающие кувшинки по бокам и снизу
      drawLilyPad(ctx, 120, 680, 220, 65, true);
      drawLilyPad(ctx, 680, 660, 240, 70, false);
      drawLilyPad(ctx, 400, 560, 380, 110, true);

      // Мушки летают вокруг
      drawFly(ctx, 160, 280, 1.8);
      drawFly(ctx, 640, 240, 2.2);
      drawFly(ctx, 220, 480, 1.5);

      // Искры и пузырьки воды
      for (let i = 0; i < 30; i++) {
        const px = Math.random() * w;
        const py = Math.random() * h;
        const pr = 2 + Math.random() * 5;
        ctx.fillStyle = 'rgba(100, 255, 218, 0.4)';
        ctx.beginPath();
        ctx.arc(px, py, pr, 0, Math.PI * 2);
        ctx.fill();
      }

      // Главный герой — милый крупный Лягушонок по центру!
      drawCuteFrog(ctx, 400, 430, 2.9, true, true);

      // Заголовок вверху
      drawGoldBadgeText(ctx, 'FROGGY JUMP', 400, 140, 76, 'Лягушонок-прыгун 2D');

      // Рамка игры
      ctx.strokeStyle = '#4caf50';
      ctx.lineWidth = 14;
      ctx.strokeRect(7, 7, w - 14, h - 14);
    }

    // =========================================================================
    // 2. Отрисовка Портретного Промо (1080x1920)
    // =========================================================================
    function renderPortrait() {
      const c = document.getElementById('canvasPortrait');
      const ctx = c.getContext('2d');
      const w = 1080, h = 1920;

      // Градиент от глубокого звездного неба к пруду
      const bgGrad = ctx.createLinearGradient(0, 0, 0, h);
      bgGrad.addColorStop(0, '#09131c');
      bgGrad.addColorStop(0.35, '#0e2b2c');
      bgGrad.addColorStop(0.7, '#143c2c');
      bgGrad.addColorStop(1, '#1b4d36');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      // Звезды и сияние вверху
      for (let i = 0; i < 70; i++) {
        const sx = Math.random() * w;
        const sy = Math.random() * (h * 0.4);
        ctx.fillStyle = 'rgba(255, 255, 255, ' + (0.3 + Math.random() * 0.7) + ')';
        ctx.beginPath();
        ctx.arc(sx, sy, 1.5 + Math.random() * 2.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // Путь из платформ-кувшинок вверх
      const pads = [
        { x: 540, y: 1750, w: 500, h: 140, f: true },
        { x: 260, y: 1480, w: 320, h: 90, f: false },
        { x: 800, y: 1320, w: 340, h: 95, f: true },
        { x: 380, y: 1120, w: 300, h: 85, f: false },
        { x: 740, y: 920, w: 310, h: 85, f: false },
        { x: 320, y: 720, w: 290, h: 80, f: true },
        { x: 680, y: 540, w: 280, h: 75, f: false }
      ];

      pads.forEach(p => drawLilyPad(ctx, p.x, p.y, p.w, p.h, p.f));

      // Мушки по пути
      drawFly(ctx, 380, 1040, 2.5);
      drawFly(ctx, 740, 840, 2.5);
      drawFly(ctx, 320, 640, 2.8);

      // Лягушонок в супер-прыжке на крыльях летит ввысь!
      drawCuteFrog(ctx, 540, 960, 3.4, true, true);

      // Золотистый шлейф супер-прыжка
      for (let i = 0; i < 40; i++) {
        const sx = 540 + (Math.random() - 0.5) * 160;
        const sy = 1080 + Math.random() * 320;
        ctx.fillStyle = '#ffeb3b';
        ctx.beginPath();
        ctx.arc(sx, sy, 3 + Math.random() * 5, 0, Math.PI * 2);
        ctx.fill();
      }

      // Верхний заголовок
      drawGoldBadgeText(ctx, 'FROGGY JUMP', 540, 230, 108, 'ПРЫГАЙ ВЫШЕ ОБЛАКОВ!');

      // Плашка с фичами внизу
      ctx.save();
      ctx.fillStyle = 'rgba(12, 28, 20, 0.85)';
      ctx.strokeStyle = '#4caf50';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.roundRect(100, 1780, w - 200, 90, 25);
      ctx.fill();
      ctx.stroke();

      ctx.font = 'bold 36px "Segoe UI", system-ui, sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.fillText('🌿 Лови мушек • ⚡ Ставь рекорды!', 540, 1838);
      ctx.restore();

      // Рамка
      ctx.strokeStyle = '#4caf50';
      ctx.lineWidth = 16;
      ctx.strokeRect(8, 8, w - 16, h - 16);
    }

    // =========================================================================
    // 3. Отрисовка Пейзажного Промо (1920x1080)
    // =========================================================================
    function renderLandscape() {
      const c = document.getElementById('canvasLandscape');
      const ctx = c.getContext('2d');
      const w = 1920, h = 1080;

      // Глубокий градиент
      const bgGrad = ctx.createLinearGradient(0, 0, w, h);
      bgGrad.addColorStop(0, '#0c1a14');
      bgGrad.addColorStop(0.5, '#122c22');
      bgGrad.addColorStop(1, '#1a4232');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, w, h);

      // Декоративные кувшинки на фоне
      drawLilyPad(ctx, 1600, 950, 480, 140, true);
      drawLilyPad(ctx, 1250, 820, 320, 90, false);
      drawLilyPad(ctx, 1750, 480, 360, 100, true);
      drawLilyPad(ctx, 1300, 260, 280, 80, false);

      // Мушки
      drawFly(ctx, 1260, 740, 2.8);
      drawFly(ctx, 1720, 400, 3.2);

      // Огромный милый Лягушонок справа на кувшинке
      drawCuteFrog(ctx, 1520, 640, 4.2, true, true);

      // Искры вокруг лягушонка
      for (let i = 0; i < 45; i++) {
        const px = 1200 + Math.random() * 650;
        const py = 300 + Math.random() * 600;
        ctx.fillStyle = '#64ffda';
        ctx.beginPath();
        ctx.arc(px, py, 2.5 + Math.random() * 4, 0, Math.PI * 2);
        ctx.fill();
      }

      // Левая колонка: Заголовок и карточки преимуществ
      drawGoldBadgeText(ctx, 'FROGGY JUMP 2D', 580, 220, 102, 'Увлекательный вертикальный 2D-джампер');

      const features = [
        { icon: '🌿', title: '5 видов кувшинок и платформ', desc: 'Движущиеся, пружинистые и исчезающие листья' },
        { icon: '🪰', title: 'Бонусы и стрекозиные крылья', desc: 'Супер-полет вверх, ловля мошек и защитный пузырь' },
        { icon: '⚡', title: 'Второе дыхание (Revive)', desc: 'Мгновенное спасение от падения в воду' },
        { icon: '🎮', title: 'Для компьютеров и смартфонов', desc: 'Управление стрелками, тачем или наклоном устройства' }
      ];

      let startY = 320;
      features.forEach(f => {
        ctx.save();
        // Подложка карточки
        ctx.fillStyle = 'rgba(16, 36, 26, 0.88)';
        ctx.strokeStyle = 'rgba(76, 175, 80, 0.4)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(140, startY, 880, 92, 16);
        ctx.fill();
        ctx.stroke();

        // Иконка
        ctx.font = '44px "Segoe UI", system-ui, sans-serif';
        ctx.fillText(f.icon, 165, startY + 62);

        // Заголовок карточки
        ctx.font = 'bold 28px "Segoe UI", system-ui, sans-serif';
        ctx.fillStyle = '#c8e6c9';
        ctx.fillText(f.title, 235, startY + 40);

        // Описание
        ctx.font = '20px "Segoe UI", system-ui, sans-serif';
        ctx.fillStyle = '#a5d6a7';
        ctx.fillText(f.desc, 235, startY + 72);
        ctx.restore();

        startY += 112;
      });

      // Кнопка призыва к действию
      ctx.save();
      const btnGrad = ctx.createLinearGradient(140, startY + 20, 560, startY + 20);
      btnGrad.addColorStop(0, '#4caf50');
      btnGrad.addColorStop(1, '#81c784');
      ctx.fillStyle = btnGrad;
      ctx.beginPath();
      ctx.roundRect(140, startY + 20, 440, 74, 20);
      ctx.fill();

      ctx.fillStyle = '#0a1d12';
      ctx.font = '900 32px "Segoe UI", system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('▶ ИГРАТЬ БЕСПЛАТНО', 360, startY + 68);
      ctx.restore();

      // Рамка
      ctx.strokeStyle = '#4caf50';
      ctx.lineWidth = 16;
      ctx.strokeRect(8, 8, w - 16, h - 16);
    }

    window.onload = function() {
      renderSquare();
      renderPortrait();
      renderLandscape();
      window.__PROMO_RENDER_READY = true;
    };
  </script>
</body>
</html>
